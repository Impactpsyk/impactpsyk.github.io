<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Group — Developer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #1a73e8;
            margin-bottom: 0.5rem;
        }
        .tagline {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .apps {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .apps h2 {
            font-size: 1rem;
            color: #444;
            margin-bottom: 0.5rem;
        }
        .app-link {
            display: block;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.4rem;
            background: #f0f4ff;
            border-radius: 8px;
            text-decoration: none;
            color: #1a73e8;
            font-weight: 500;
            transition: background 0.2s;
        }
        .app-link:hover { background: #e0eaff; }
        .contact {
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        .contact a { color: #1a73e8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Impact Group</h1>
        <p class="tagline">Mobile applications for everyday life</p>
        <div class="apps">
            <h2>Privacy Policies</h2>
            <a class="app-link" href="/impact-smart-pack-privacy/">Impact Smart Pack</a>
            <a class="app-link" href="/impact-budget-privacy/">Impact Budget</a>
        </div>
        <div class="contact">
            <p>Contact: <a href="mailto:impact.pyk@gmail.com">impact.pyk@gmail.com</a></p>
        </div>
    </div>
</body>
</html>
